<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle / Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Ambient Glow Behind Glyph -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)"/>

  <!-- Main Wallet / Expense Vault Card -->
  <g filter="url(#dropShadow)">
    <!-- Base Wallet / Card Shape -->
    <rect x="116" y="146" width="280" height="220" rx="36" fill="url(#glyphGrad)"/>
    <path d="M116 210 Q 256 226 396 210" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" fill="none"/>
    
    <!-- Flap & Pocket -->
    <path d="M260 216 H396 V296 H260 A 40 40 0 0 1 260 216 Z" fill="#064e3b" stroke="#047857" stroke-width="4"/>
    <circle cx="340" cy="256" r="16" fill="#f8fafc"/>
    <circle cx="340" cy="256" r="8" fill="#10b981"/>

    <!-- Dynamic Spark / Flash / Quick Add Marker -->
    <path d="M190 220 L204 250 L234 256 L204 262 L190 292 L176 262 L146 256 L176 250 Z" fill="#ffffff" fill-opacity="0.9"/>
  </g>
</svg>
